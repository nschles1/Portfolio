<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Nikki Schlesinger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Manrope:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-slate: #384959;
            --clear-sky: #88BDF2;
        }
        body { 
            background-color: #F8FAFC; 
            color: var(--deep-slate); 
            font-family: 'Manrope', sans-serif; 
        }
        h1 { font-family: 'Aboreto', cursive; }
        .btn-stormy {
            background-color: var(--clear-sky);
            color: white;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-6 text-center">

    <main class="max-w-md">
        <div class="mb-8 inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow-sm text-sky-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        
        <h1 class="text-3xl md:text-4xl mb-4 uppercase tracking-widest">Thank You</h1>
        <p class="text-slate-500 mb-10 leading-relaxed">
            Your message has been received. I look forward to connecting with you soon.
        </p>
        
        <a href="index.html" class="btn-stormy px-8 py-4 rounded-xl font-bold uppercase tracking-[0.2em] text-xs inline-block hover:brightness-110 transition">
            Back to Home
        </a>
    </main>

</body>
</html>
