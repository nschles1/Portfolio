<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nikki Schlesinger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Manrope:wght@300;500;700&family=Noto+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-slate: #384959;
            --muted-blue: #6A89A7;
            --clear-sky: #88BDF2;
            --soft-frost: #BDDDFC;
        }
        body { 
            background-color: #F8FAFC; 
            color: var(--deep-slate); 
            font-family: 'Noto Sans', sans-serif; 
        }
        h1, .editorial-font { font-family: 'Aboreto', cursive; }
        .ui-font { font-family: 'Manrope', sans-serif; }
        .glass-nav { background: rgba(248, 250, 252, 0.8); backdrop-filter: blur(20px); }
        
        .form-input {
            width: 100%;
            padding: 1rem;
            background: white;
            border: 1px solid rgba(56, 73, 89, 0.1);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .form-input:focus { border-color: var(--clear-sky); }
        
        .btn-stormy {
            background-color: var(--clear-sky);
            color: white;
            transition: all 0.3s ease;
        }
        .hidden { display: none; }
    </style>
</head>
<body class="antialiased">

    <nav class="fixed top-0 w-full z-50 glass-nav border-b border-slate-200 px-6">
        <div class="max-w-6xl mx-auto h-16 flex justify-between items-center">
            <a href="index.html" class="editorial-font text-lg tracking-widest font-bold">NIKKI SCHLESINGER</a>
            <div class="hidden md:flex items-center gap-10 ui-font text-[11px] font-bold uppercase tracking-[0.2em]">
                <a href="index.html" class="text-slate-400 hover:text-slate-900 transition">Work</a>
                <a href="about.html" class="text-slate-400 hover:text-slate-900 transition">About</a>
                <a href="thinking.html" class="text-slate-400 hover:text-slate-900 transition">Thinking</a>
                <a href="contact.html" class="text-slate-900 border-b-2 border-slate-900">Contact</a>
                <a href="Nikki Schlesinger Resume.pdf" download class="btn-stormy px-5 py-2 rounded-full lowercase font-semibold tracking-normal hover:brightness-110 transition">resume</a>
            </div>
        </div>
    </nav>

    <main class="pt-40 pb-24 px-6 max-w-2xl mx-auto">
        <section id="contact-content">
            <h1 class="text-4xl mb-6">Get in touch</h1>
            <p class="text-slate-500 mb-12 text-lg">Have a project in mind or just want to connect? Drop me a line below.</p>

            <form id="contact-form" action="https://formspree.io/f/your-endpoint" method="POST" class="space-y-6">
                <div>
                    <label class="ui-font text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2 block">Name</label>
                    <input type="text" name="name" required class="form-input">
                </div>
                <div>
                    <label class="ui-font text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2 block">Email Address</label>
                    <input type="email" name="email" required class="form-input">
                </div>
                <div>
                    <label class="ui-font text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2 block">Message</label>
                    <textarea name="message" rows="5" required class="form-input"></textarea>
                </div>
                <button type="submit" class="btn-stormy w-full py-4 rounded-xl ui-font font-bold uppercase tracking-widest text-sm hover:brightness-110">
                    Send Message
                </button>
            </form>

            <div id="success-message" class="hidden text-center py-20 animate-in fade-in slide-in-from-bottom-4 duration-700">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 text-green-500 rounded-full mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold mb-2">Message Sent!</h2>
                <p class="text-slate-500">Thanks for reaching out, Nikki will get back to you shortly.</p>
                <button onclick="window.location.reload()" class="mt-8 text-sm ui-font font-bold text-slate-400 uppercase tracking-widest hover:text-slate-900 transition">Send another</button>
            </div>
        </section>
    </main>

    <script>
        // Simple script to handle the "In-Page" confirmation
        const form = document.getElementById('contact-form');
        const successMessage = document.getElementById('success-message');
        const contentHeader = document.querySelector('h1');
        const contentSub = document.querySelector('p');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = new FormData(form);
            
            // Send the data to Formspree
            const response = await fetch(form.action, {
                method: 'POST',
                body: data,
                headers: { 'Accept': 'application/json' }
            });

            if (response.ok) {
                // Hide form and text, show success message
                form.classList.add('hidden');
                contentHeader.classList.add('hidden');
                contentSub.classList.add('hidden');
                successMessage.classList.remove('hidden');
            } else {
                alert('Oops! There was a problem submitting your form');
            }
        });
    </script>
</body>
</html>
