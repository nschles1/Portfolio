<section class="pt-48 pb-32 px-6 max-w-4xl mx-auto">
    <div id="form-container">
        <h1 class="text-4xl md:text-6xl mb-8 editorial-font">Get in touch</h1>
        <p class="text-slate-500 text-lg mb-12 font-light">
            Have a project in mind or looking to scale your program operations? Reach out and let's build something together.
        </p>

        <form id="contact-form" action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST" class="space-y-8">
            <div class="grid md:grid-cols-2 gap-8">
                <div class="space-y-2">
                    <label class="ui-font text-[10px] font-bold uppercase tracking-widest text-slate-400">Name</label>
                    <input type="text" name="name" required class="w-full bg-transparent border-b border-slate-200 py-3 focus:border-[var(--muted-blue)] outline-none transition">
                </div>
                <div class="space-y-2">
                    <label class="ui-font text-[10px] font-bold uppercase tracking-widest text-slate-400">Email</label>
                    <input type="email" name="email" required class="w-full bg-transparent border-b border-slate-200 py-3 focus:border-[var(--muted-blue)] outline-none transition">
                </div>
            </div>
            <div class="space-y-2">
                <label class="ui-font text-[10px] font-bold uppercase tracking-widest text-slate-400">Message</label>
                <textarea name="message" rows="4" required class="w-full bg-transparent border-b border-slate-200 py-3 focus:border-[var(--muted-blue)] outline-none transition"></textarea>
            </div>
            <button type="submit" id="submit-btn" class="px-12 py-4 rounded-full bg-[var(--deep-slate)] text-white ui-font text-xs font-bold uppercase tracking-[0.2em] hover:scale-105 transition-all shadow-lg shadow-slate-200">
                Send Message
            </button>
        </form>
    </div>

    <div id="success-message" class="hidden text-center py-20">
        <div class="w-20 h-20 bg-[var(--soft-frost)] rounded-full flex items-center justify-center mx-auto mb-8">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="var(--muted-blue)" class="w-10 h-10">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
        </div>
        <h2 class="text-3xl md:text-4xl mb-4 editorial-font">Message Received</h2>
        <p class="text-slate-500 text-lg font-light max-w-md mx-auto mb-10">
            Thank you for reaching out. I’ve received your message and will get back to you within 24–48 hours.
        </p>
        <a href="index.html" class="ui-font text-[10px] font-bold uppercase tracking-widest border-b-2 border-slate-900 pb-1 hover:text-[var(--muted-blue)] hover:border-[var(--muted-blue)] transition">
            Back to Home
        </a>
    </div>
</section>

<script>
    const form = document.getElementById("contact-form");
    const formContainer = document.getElementById("form-container");
    const successMessage = document.getElementById("success-message");
    const submitBtn = document.getElementById("submit-btn");

    async function handleSubmit(event) {
      event.preventDefault();
      submitBtn.innerHTML = "Sending...";
      submitBtn.disabled = true;

      const data = new FormData(event.target);
      
      fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          formContainer.classList.add("hidden");
          successMessage.classList.remove("hidden");
        } else {
          response.json().then(data => {
            if (Object.hasOwn(data, 'errors')) {
              alert(data["errors"].map(error => error["message"]).join(", "));
            } else {
              alert("Oops! There was a problem submitting your form");
            }
          })
        }
      }).catch(error => {
        alert("Oops! There was a problem submitting your form");
      });
    }
    
    form.addEventListener("submit", handleSubmit)
</script>
